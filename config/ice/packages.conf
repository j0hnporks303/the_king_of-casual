# Optional visual customization packages installed by `tkoc ice`.
# One official Fedora package name per line; comments and blank lines are
# ignored. Package names are validated before dnf is invoked.
#
# The Arch original listed ttf-nerd-fonts-symbols-mono. Fedora's equivalent
# symbol-only Nerd Font is nerd-fonts-symbols, with the full patched families
# available individually (jetbrains-mono-fonts-all, etc.).
nerd-fonts-symbols
