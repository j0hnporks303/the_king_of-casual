#!/usr/bin/nft -f
# the_king_of-casual / nftables v2
#
# Scope:
#   - Host firewall for an Arch Linux workstation.
#   - Default-deny inbound and forwarded traffic.
#   - Default-allow outbound traffic with conventional DNS-port enforcement.
#   - IPv4 on external interfaces; IPv6 remains available only on loopback.
#   - Replaces only its own table; it does not erase tables owned by other tools.
#
# This is not an application-aware egress firewall. In particular, it does not
# claim to block DNS-over-HTTPS, VPNs, Tor, proxies, or arbitrary HTTPS tunnels.
#
# Deployment:
#   1. Adjust ALLOWED_DNS4 and the optional VM/container interface rules.
#   2. Validate: nft --check --file /etc/nftables.conf
#   3. Load:     nft --file /etc/nftables.conf
#   4. Inspect:  nft list table inet tkoc_host
#
# `destroy table` is deliberately used instead of `flush ruleset`. It does not
# fail when this table is absent, and replacement through `nft -f` is atomic.
# Requires nftables >= 1.0.7 and Linux >= 6.3 for `destroy` semantics. Current
# Arch kernels and packages satisfy both requirements.

# Normal DNS resolvers permitted on UDP/TCP port 53. Local stub resolvers on
# loopback are allowed independently by the loopback rules below.
define ALLOWED_DNS4 = { 172.16.2.40 }

destroy table inet tkoc_host

table inet tkoc_host {
    comment "Arch workstation host firewall; managed by the_king_of-casual"

    # Named counters keep diagnostics useful without logging every packet.
    counter input_invalid       { }
    counter input_spoofed       { }
    counter input_ipv6_blocked  { }
    counter input_noise_blocked { }
    counter input_dropped       { }

    counter forward_invalid       { }
    counter forward_ipv6_blocked  { }
    counter forward_guest_new     { }
    counter forward_dropped       { }

    counter output_invalid      { }
    counter output_ipv6_blocked { }
    counter output_dns_blocked  { }
    counter output_dot_blocked  { }
    counter output_lan_noise_blocked { }
    counter output_allowed      { }

    chain input {
        type filter hook input priority filter; policy drop;

        # Local IPC, including ::1, remains available.
        iifname "lo" accept

        # Reject impossible or spoofed traffic before the established-flow rule.
        ct state invalid counter name input_invalid drop
        iifname != "lo" ip saddr 127.0.0.0/8 counter name input_spoofed drop

        # Off-host IPv6 is intentionally disabled. This precedes conntrack so a
        # pre-existing IPv6 flow cannot survive a ruleset reload.
        meta nfproto ipv6 counter name input_ipv6_blocked drop

        # Drop discovery multicast even if conntrack has seen prior traffic.
        ip protocol igmp counter name input_noise_blocked drop
        ip daddr 224.0.0.0/4 counter name input_noise_blocked drop

        # Replies to connections initiated by this host, plus genuinely related
        # traffic such as ICMP errors.
        ct state established,related accept

        # DHCPv4 server-to-client replies. DHCP itself is unauthenticated; this
        # merely permits the protocol needed by NetworkManager on non-loopback
        # interfaces.
        iifname != "lo" udp sport 67 udp dport 68 accept

        # Essential IPv4 control traffic. Rate-limited so forged/flooded ICMP
        # errors cannot be used to waste cycles; excess
        # requests fall through to the final drop.
        ip protocol icmp icmp type {
            destination-unreachable,
            time-exceeded,
            parameter-problem
        } limit rate 10/second burst 20 packets accept
        ip protocol icmp icmp type echo-request limit rate 5/second burst 10 packets accept

        # Keep routine LAN discovery noise out of the limited kernel log while
        # retaining a distinct counter for troubleshooting.
        udp dport { 137, 138, 1716, 1900, 27036, 5353, 5355 } counter name input_noise_blocked drop
        tcp dport { 139, 445 } counter name input_noise_blocked drop

        # Optional inbound services belong above this line. Examples:
        # tcp dport 22 ct state new limit rate 10/minute burst 5 packets accept
        # udp dport 51820 accept

        # Log only a bounded sample, then count and drop every unmatched packet.
        limit rate 5/second burst 10 packets log prefix "tkoc input drop: " flags all
        counter name input_dropped drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid counter name forward_invalid drop
        meta nfproto ipv6 counter name forward_ipv6_blocked drop
        ct state established,related accept

        # VM/container guests may initiate IPv4 traffic. Return traffic is
        # covered by established/related above. Remove interface families that
        # are not used on this host.
        #
        # This is a broad accept for traffic originating on guest interfaces.
        # New flows are counted for visibility. Replace these accepts with
        # destination and service allowlists when guests need tighter isolation.
        iifname "vboxnet*" ct state new counter name forward_guest_new accept
        iifname "vboxnet*" accept
        iifname "virbr*" ct state new counter name forward_guest_new accept
        iifname "virbr*" accept
        iifname "incusbr*" ct state new counter name forward_guest_new accept
        iifname "incusbr*" accept
        iifname "docker*" ct state new counter name forward_guest_new accept
        iifname "docker*" accept
        iifname "br-*" ct state new counter name forward_guest_new accept
        iifname "br-*" accept

        # Permit explicitly DNATed/published services to the corresponding guest
        # networks without allowing arbitrary new inbound forwarding.
        oifname "vboxnet*" ct status dnat accept
        oifname "virbr*" ct status dnat accept
        oifname "incusbr*" ct status dnat accept
        oifname "docker*" ct status dnat accept
        oifname "br-*" ct status dnat accept

        limit rate 5/second burst 10 packets log prefix "tkoc forward drop: " flags all
        counter name forward_dropped drop
    }

    chain output {
        type filter hook output priority filter; policy accept;

        # Preserve local IPC and local DNS stubs, including ::1.
        oifname "lo" accept

        ct state invalid counter name output_invalid drop

        # Off-host IPv6 and prohibited DNS transports are evaluated before the
        # established-flow accept, so existing flows cannot bypass a reload.
        meta nfproto ipv6 counter name output_ipv6_blocked drop

        # Suppress host discovery and multicast chatter. DHCP client requests
        # remain permitted so dynamically configured networks keep working.
        ip protocol igmp counter name output_lan_noise_blocked drop
        ip daddr 224.0.0.0/4 counter name output_lan_noise_blocked drop
        ip daddr 255.255.255.255 udp dport != 67 counter name output_lan_noise_blocked drop
        udp dport { 137, 138, 1716, 1900, 27036, 5353, 5355 } \
            counter name output_lan_noise_blocked drop

        ip daddr $ALLOWED_DNS4 udp dport 53 accept
        ip daddr $ALLOWED_DNS4 tcp dport 53 accept

        udp dport 53 limit rate 2/second burst 5 packets log prefix "tkoc DNS block: " flags all
        udp dport 53 counter name output_dns_blocked drop

        tcp dport 53 limit rate 2/second burst 5 packets log prefix "tkoc DNS block: " flags all
        tcp dport 53 counter name output_dns_blocked drop

        # Cover DNS-over-TLS (TCP) and DNS-over-QUIC (UDP) on the dedicated port.
        meta l4proto { tcp, udp } th dport 853 limit rate 2/second burst 5 packets log prefix "tkoc encrypted DNS block: " flags all
        meta l4proto { tcp, udp } th dport 853 counter name output_dot_blocked drop

        ct state established,related accept

        # Deliberately permissive workstation egress. Application-aware or
        # destination allowlisting should be a separate, opt-in policy because
        # generic nftables rules cannot reliably identify DoH inside HTTPS.
        counter name output_allowed accept
    }
}
