# the_king_of-casual: conservative Arch workstation hardening
# Keep settings here reversible and compatible with ordinary desktop workloads.

# Restrict kernel address and log exposure to privileged users.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Prevent unprivileged BPF use while leaving the setting reversible by root.
# A value of 1 would make the change irreversible until the next boot.
kernel.unprivileged_bpf_disabled = 2

# Limit cross-process inspection to descendants unless explicitly authorized.
kernel.yama.ptrace_scope = 1

# Preserve full ASLR and reduce low-level attack primitives available to
# unprivileged processes. These remain reversible by root.
kernel.randomize_va_space = 2
kernel.perf_event_paranoid = 3
vm.unprivileged_userfaultfd = 0
dev.tty.ldisc_autoload = 0

# Do not create privileged core dumps.
fs.suid_dumpable = 0

# Protect common temporary-file operations against link and FIFO attacks.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Reject source routing and ICMP redirects on current and future interfaces.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Loose reverse-path filtering blocks clearly invalid sources while remaining
# compatible with common VPN and multi-homed workstation configurations.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# The firewall already drops all off-host IPv6, keeping it available only on
# loopback. Disable it at the kernel level too, so that guarantee survives a
# firewall reload or failure rather than depending on nftables alone.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 0
